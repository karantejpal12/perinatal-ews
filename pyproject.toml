[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perinatal-ews"
version = "0.4.0"
description = "Open-source early-warning analytics for county-level maternal and newborn health indicators"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karan Tejpal" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0", "scikit-learn>=1.3"]
keywords = ["public health", "maternal health", "surveillance", "natality", "early warning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Repository = "https://github.com/karantejpal12/perinatal-ews"

[project.optional-dependencies]
dev = ["pytest>=7"]
context = ["shapely>=2.0"]

[project.scripts]
perinatal-ews = "perinatal_ews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perinatal_ews = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
